name: ai_hub
description: Orbit - one chat app for many free AI models through a local FreeLLMAPI gateway.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Voice
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Files, images, video
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  permission_handler: ^11.3.1
  mime: ^1.0.5

  # UI helpers
  flutter_markdown: ^0.7.4
  flutter_colorpicker: ^1.1.0

  # Utilities
  intl: ">=0.19.0 <0.21.0"
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

# Makes the app icon from the images in assets/icon (run by GitHub Actions).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/orbit_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/orbit_icon_foreground.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
