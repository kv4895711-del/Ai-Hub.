name: Build Orbit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Check the icon images are there
        run: |
          ls -l assets/icon
          test -f assets/icon/orbit_icon.png
          test -f assets/icon/orbit_icon_foreground.png

      - name: Create the Android project files
        run: |
          flutter create --platforms=android --org com.aihub --project-name ai_hub .
          rm -rf test

      - name: Apply our Android settings (name, permissions, Termux code)
        run: bash tools/patch_android.sh

      - name: Get packages
        run: flutter pub get

      - name: Make the app icon
        run: dart run flutter_launcher_icons

      - name: Build the APK
        run: flutter build apk --release

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
